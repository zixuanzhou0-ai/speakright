  <circle cx="640" cy="320" r="92" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
  <path d="M615 269 692 320 615 371Z" fill="#ffffff"/>
  <text x="640" y="480" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="700" text-anchor="middle">SpeakRight</text>

name: Browser E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SPEAKRIGHT_COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Record build timestamp
        shell: pwsh
        run: "\"NEXT_PUBLIC_SPEAKRIGHT_BUILD_TIMESTAMP=$([DateTime]::UtcNow.ToString('o'))\" >> $env:GITHUB_ENV"

      - name: Install root dependencies
        run: npm ci

      - name: Install Browser Edition dependencies
        run: npm ci --prefix apps/browser

      - name: Verify release manifest
        run: npm run check:release-version

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Validate Browser Edition with gated fixtures
        run: npm run validate:browser:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

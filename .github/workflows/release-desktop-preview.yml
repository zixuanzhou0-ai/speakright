name: Release Desktop Preview

on:
  push:
    tags:
      - "v*-desktop-preview.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop preview tag to validate without publishing
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    env:
      NEXT_PUBLIC_SPEAKRIGHT_TEST_FIXTURES: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Resolve release identity
        id: release
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          RELEASE_EDITION: desktop
        run: |
          $ErrorActionPreference = "Stop"
          $config = Get-Content -LiteralPath release.config.json -Raw | ConvertFrom-Json
          $expectedTag = $config.editions.PSObject.Properties[$env:RELEASE_EDITION].Value.releaseTag
          if ($env:REQUESTED_TAG -cne $expectedTag) {
            throw "release.config.json expects tag '$expectedTag', received '$env:REQUESTED_TAG'."
          }

          $headSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($headSha)) {
            throw "Could not resolve the checked-out HEAD commit."
          }
          $tagRef = "refs/tags/$env:REQUESTED_TAG"
          $tagSha = (git rev-parse --verify "${tagRef}^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagSha)) {
            throw "Could not resolve requested tag '$env:REQUESTED_TAG' to a commit."
          }
          if ($headSha -cne $tagSha) {
            throw "Checked-out HEAD '$headSha' does not equal tag '$env:REQUESTED_TAG' commit '$tagSha'."
          }

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/main for ancestry verification."
          }
          git merge-base --is-ancestor $headSha refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit '$headSha' is not an ancestor of origin/main."
          }

          "version=$($config.version)" >> $env:GITHUB_OUTPUT
          "release_tag=$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
          "commit_sha=$headSha" >> $env:GITHUB_OUTPUT
          "NEXT_PUBLIC_SPEAKRIGHT_COMMIT_SHA=$headSha" >> $env:GITHUB_ENV
          "NEXT_PUBLIC_SPEAKRIGHT_BUILD_TIMESTAMP=$([DateTime]::UtcNow.ToString('o'))" >> $env:GITHUB_ENV
          "NEXT_PUBLIC_SPEAKRIGHT_VALIDATED_AT=$([DateTime]::UtcNow.ToString('yyyy-MM-dd'))" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Verify preview tag and release manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: npm run check:release-version -- --edition desktop --tag "$env:RELEASE_TAG"

      - name: Verify user-testing claim and privacy boundaries
        run: |
          npm run user-testing:claims:test
          npm run user-testing:claims:check

      - name: Verify Desktop and Browser core parity
        run: npm run check:core-parity

      - name: Reject production dependency advisories
        run: npm run security:audit:npm

      - name: Verify distributable asset rights and manifests
        run: |
          npm run assets:test
          npm run assets:manifests:check
          npm run assets:rights:check

      - name: Verify release media tooling
        run: ffprobe -version

      - name: Validate public documentation and release evidence
        run: |
          npm run docs:check-links
          npm run release:evidence:check

      - name: Validate UI smoke, fixture-free build, and isolated installer round-trip
        run: npm run validate:desktop
        timeout-minutes: 125

      - name: Verify checksums and unsigned Authenticode state
        run: npm run desktop:preview-release-gate

      - name: Install and run cargo-audit
        shell: pwsh
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          npm run security:audit:cargo

      - name: Generate npm CycloneDX SBOMs
        run: npm run security:sbom:npm

      - name: Generate Cargo CycloneDX SBOM
        shell: pwsh
        run: |
          cargo install cargo-cyclonedx --locked --version 0.5.9
          npm run security:sbom:cargo

      - name: Stage unsigned Desktop Preview assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
        run: |
          node scripts/release-validation-attachment.contract.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Release validation attachment contract failed."
          }
          node scripts/release-staging.contract.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "Release staging contract failed."
          }
          node scripts/github-release-verification.contract.mjs
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release verification contract failed."
          }
          npm run desktop:preview-release-gate
          if ($LASTEXITCODE -ne 0) {
            throw "Final Desktop Preview gate failed before staging."
          }
          $stage = "outputs/release/staging"
          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $releaseExecutable = "src-tauri/target/release/speakright.exe"
          $releaseReport = "src-tauri/target/release/bundle/SpeakRight_$($env:RELEASE_VERSION)_release-report.json"
          $roundtripReport = "src-tauri/target/release/bundle/SpeakRight_$($env:RELEASE_VERSION)_installer-roundtrip.json"
          $nsisInstaller = "src-tauri/target/release/bundle/nsis/SpeakRight_$($env:RELEASE_VERSION)_x64-setup.exe"
          $validatedReleaseReportHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $releaseReport).Hash.ToLower()
          $report = Get-Content -LiteralPath $releaseReport -Raw | ConvertFrom-Json
          Copy-Item -LiteralPath $releaseExecutable -Destination $stage
          Copy-Item -LiteralPath $releaseReport -Destination $stage
          Copy-Item -LiteralPath $roundtripReport -Destination $stage
          Copy-Item -LiteralPath $nsisInstaller -Destination $stage
          Copy-Item -Path outputs/release/sbom/*.json -Destination $stage
          Copy-Item -LiteralPath CHANGELOG.md -Destination $stage
          Copy-Item -LiteralPath LICENSE -Destination $stage
          Copy-Item -LiteralPath NOTICE.md -Destination $stage
          Copy-Item -LiteralPath PRIVACY.md -Destination $stage
          Copy-Item -LiteralPath THIRD_PARTY_NOTICES.md -Destination $stage
          Copy-Item -LiteralPath docs/assets/asset-rights-registry.json -Destination (Join-Path $stage "SpeakRight_v1.1.0_asset-rights-registry.json")
          Copy-Item -LiteralPath docs/validation/USER_TESTING_SUMMARY.md -Destination (Join-Path $stage "SpeakRight_v1.1.0_user-testing-summary.md")
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $releaseReport).Hash.ToLower() -ne $validatedReleaseReportHash) {
            throw "Desktop release report changed after the final gate."
          }
          foreach ($artifactType in @("exe", "nsis")) {
            $reported = @($report.artifacts | Where-Object { $_.type -eq $artifactType })
            if ($reported.Count -ne 1) {
              throw "Desktop release report must contain exactly one $artifactType artifact."
            }
            $stagedArtifact = Join-Path $stage ([IO.Path]::GetFileName([string]$reported[0].path))
            if (-not (Test-Path -LiteralPath $stagedArtifact -PathType Leaf)) {
              throw "Staged $artifactType artifact is missing."
            }
            $stagedInfo = Get-Item -LiteralPath $stagedArtifact
            $stagedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $stagedArtifact).Hash.ToLower()
            if ($stagedInfo.Length -ne [long]$reported[0].bytes -or $stagedHash -ne [string]$reported[0].sha256) {
              throw "Staged $artifactType artifact does not match the final release report."
            }
          }
          $stagedRoundtripReport = Join-Path $stage ([IO.Path]::GetFileName($roundtripReport))
          $stagedRoundtripHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $stagedRoundtripReport).Hash.ToLower()
          if ($stagedRoundtripHash -ne [string]$report.installerRoundtrip.sha256) {
            throw "Staged installer round-trip evidence does not match the final release report."
          }
          $releaseValidation = Join-Path $stage "SpeakRight_v1.1.0_release-validation.md"
          node scripts/generate-release-validation-attachment.mjs --edition desktop --tag $env:RELEASE_TAG --commit $env:RELEASE_COMMIT_SHA --output $releaseValidation
          if ($LASTEXITCODE -ne 0) {
            throw "Release validation attachment generation failed."
          }
          $checksumLines = Get-ChildItem -LiteralPath $stage -File | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            "$($hash.Hash.ToLower())  $($_.Name)"
          }
          $checksumLines | Set-Content -LiteralPath (Join-Path $stage "SHA256SUMS.txt") -Encoding utf8
          node scripts/verify-release-staging.mjs --edition desktop --version $env:RELEASE_VERSION --stage $stage
          if ($LASTEXITCODE -ne 0) {
            throw "Desktop release staging verification failed."
          }

      - name: Upload verified Desktop Preview assets
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speakright-desktop-unsigned-preview-release-assets
          path: outputs/release/staging/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Desktop Preview validation reports
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: speakright-desktop-preview-validation-reports
          path: |
            src-tauri/target/release/bundle/*_release-report.json
            src-tauri/target/release/bundle/*_installer-roundtrip.json
            outputs/release/sbom/*.json
            docs/assets/demo/manifest.json
            docs/assets/screenshots/release/v1.1.0/browser/manifest.json
            docs/assets/screenshots/release/v1.1.0/desktop/manifest.json
            outputs/release/staging/SpeakRight_v1.1.0_release-validation.md
            docs/validation/USER_TESTING_SUMMARY.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    if: ${{ github.event_name == 'push' && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout the exact built commit without persisting credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build.outputs.commit_sha }}
          persist-credentials: false

      - name: Verify remote tag identity before running repository code
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          BUILT_COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:BUILT_COMMIT_SHA -cnotmatch "^[0-9a-f]{40}$") {
            throw "Build job did not provide a full commit SHA."
          }
          $headSha = (git rev-parse HEAD).Trim()
          if ($headSha -cne $env:BUILT_COMMIT_SHA) {
            throw "Publish checkout does not equal the exact built commit."
          }
          git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ($LASTEXITCODE -ne 0) { throw "Could not refresh origin/main." }
          git fetch --force --no-tags origin "+refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not refresh the release tag." }
          $tagRef = "refs/tags/$env:RELEASE_TAG"
          $tagSha = (git rev-parse --verify "${tagRef}^{commit}").Trim()
          if ($tagSha -cne $env:BUILT_COMMIT_SHA) {
            throw "Release tag does not equal the exact built commit."
          }
          git merge-base --is-ancestor $tagSha refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw "Release commit is not on origin/main." }

      - name: Download verified Desktop Preview assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: speakright-desktop-unsigned-preview-release-assets
          path: outputs/release/staging

      - name: Re-verify downloaded Desktop Preview release assets
        run: node scripts/verify-release-staging.mjs --edition desktop --version 1.1.0 --stage outputs/release/staging

      - name: Create, remotely verify, and publish Desktop Preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          BUILT_COMMIT_SHA: ${{ needs.build.outputs.commit_sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-RemoteIdentity {
            git fetch --force --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
            if ($LASTEXITCODE -ne 0) { throw "Could not refresh origin/main." }
            git fetch --force --no-tags origin "+refs/tags/$env:RELEASE_TAG:refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Could not refresh the release tag." }
            $tagRef = "refs/tags/$env:RELEASE_TAG"
            $tagSha = (git rev-parse --verify "${tagRef}^{commit}").Trim()
            if ($tagSha -cne $env:BUILT_COMMIT_SHA) { throw "Release tag moved after validation." }
            git merge-base --is-ancestor $tagSha refs/remotes/origin/main
            if ($LASTEXITCODE -ne 0) { throw "Release commit is not on origin/main." }
          }

          Assert-RemoteIdentity
          gh release create "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false --title "SpeakRight $env:RELEASE_VERSION — Unsigned Desktop Preview" --notes "Unsigned Windows community preview. The published installer is the NSIS setup that passed install/start/exit/uninstall round-trip validation; the bare Release EXE is also included. MSI is not published in v1.1.0. Windows SmartScreen may show Unknown publisher. Verify SHA256SUMS.txt before installation."
          if ($LASTEXITCODE -ne 0) { throw "Could not create the Desktop Preview draft Release." }
          $published = $false
          try {
            $assets = Get-ChildItem -LiteralPath outputs/release/staging -File | ForEach-Object FullName
            gh release upload "$env:RELEASE_TAG" @assets --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw "Could not upload every Desktop Preview asset." }
            node scripts/verify-github-release.mjs --edition desktop --version "$env:RELEASE_VERSION" --tag "$env:RELEASE_TAG" --draft true --download true --stage outputs/release/staging
            if ($LASTEXITCODE -ne 0) { throw "Desktop Preview draft verification failed." }
            Assert-RemoteIdentity
            gh release edit "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --draft=false --prerelease=true --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the Desktop Preview Release." }
            $published = $true
            Assert-RemoteIdentity
            node scripts/verify-github-release.mjs --edition desktop --version "$env:RELEASE_VERSION" --tag "$env:RELEASE_TAG" --draft false --download false --stage outputs/release/staging
            if ($LASTEXITCODE -ne 0) { throw "Published Desktop Preview verification failed." }
          } catch {
            if ($published) {
              gh release delete "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" --yes
              if ($LASTEXITCODE -ne 0) { Write-Error "Failed to remove an unverified published Desktop Preview Release." }
            }
            throw
          }

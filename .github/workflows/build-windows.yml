name: Build Windows Desktop

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".github/**/*.md"
      - ".github/CODEOWNERS"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 80
    env:
      NEXT_PUBLIC_SPEAKRIGHT_COMMIT_SHA: ${{ github.sha }}
      NEXT_PUBLIC_SPEAKRIGHT_TEST_FIXTURES: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Windows build scope contract
        run: node .github/scripts/classify-windows-build-scope.contract.mjs

      - name: Classify documentation-only change
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/classify-windows-build-scope.mjs

      - name: Confirm documentation-only build context
        if: steps.scope.outputs.docs_only == 'true'
        shell: pwsh
        run: |
          "Required build context passed without rebuilding unchanged application code." >> $env:GITHUB_STEP_SUMMARY

      - name: Setup Node
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        if: steps.scope.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        timeout-minutes: 5

      - name: Verify release media tooling contract
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/release-media-tooling.contract.mjs

      - name: Install pinned release media tooling
        if: steps.scope.outputs.docs_only != 'true'
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/install-release-media-tools.ps1
        timeout-minutes: 10

      - name: Record build timestamp
        if: steps.scope.outputs.docs_only != 'true'
        shell: pwsh
        run: "\"NEXT_PUBLIC_SPEAKRIGHT_BUILD_TIMESTAMP=$([DateTime]::UtcNow.ToString('o'))\" >> $env:GITHUB_ENV"

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci
        timeout-minutes: 10

      - name: Validate release evidence with pinned media tooling
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run release:evidence:check

      - name: Verify release manifest
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run check:release-version

      - name: Verify release validation attachment contract
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/release-validation-attachment.contract.mjs

      - name: Verify release staging contract
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/release-staging.contract.mjs

      - name: Verify GitHub Release metadata contract
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/github-release-verification.contract.mjs

      - name: Validate publishable desktop build
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run validate:desktop-ci
        timeout-minutes: 60

      - name: Verify unsigned preview evidence
        if: github.event_name == 'workflow_dispatch' && steps.scope.outputs.docs_only != 'true'
        run: npm run desktop:preview-release-gate

      - name: Upload desktop validation reports
        if: github.event_name == 'workflow_dispatch' && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        timeout-minutes: 10
        with:
          name: speakright-windows-validation-reports
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/*_release-report.json
            src-tauri/target/release/bundle/*_installer-roundtrip.json

name: Supply Chain Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  npm-audit:
    name: Production npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Reject high or critical production advisories
        run: npm run security:audit:npm

  cargo-audit:
    name: RustSec cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Cargo.lock
        run: npm run security:audit:cargo

  secret-history:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: "8.24.3"
      GITLEAKS_LINUX_X64_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate narrowly scoped history exceptions
        run: node scripts/gitleaks-history-policy.contract.mjs

      # Migration note: gitleaks/gitleaks-action@ is intentionally not invoked.
      # Its event-specific log range cannot satisfy this full-history gate.
      - name: Download and verify pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' \
            "${GITLEAKS_LINUX_X64_SHA256}" \
            "${RUNNER_TEMP}/${archive}" | sha256sum --check -
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" \
            --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" version

      - name: Scan complete Git history
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gitleaks" detect \
            --source=. \
            --redact \
            --verbose \
            --exit-code=2 \
            --report-format=sarif \
            --report-path=results.sarif \
            --log-level=debug

      - name: Preserve redacted scan report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-results-${{ github.run_id }}-${{ github.job }}
          path: results.sarif
          if-no-files-found: error
          retention-days: 30
